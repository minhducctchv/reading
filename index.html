<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mục lục đọc sách</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --surface: #f1f5f9;
      --border: #e2e8f0;
      --tree-line: #cbd5e1;
      --text: #334155;
      --muted: #64748b;
      --heading: #0f172a;
      --accent: #1d4ed8;
      --accent-soft: #eff6ff;
      --accent-border: #bfdbfe;
      --teal: #0f766e;
      --teal-soft: #f0fdfa;
      --amber: #b45309;
      --amber-soft: #fffbeb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2.5rem 1.25rem 4rem;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.5rem 2.75rem;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
    }

    .search-wrap {
      position: relative;
      flex: 1 1 240px;
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 0.55rem 2.25rem 0.55rem 2.35rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background-color: var(--bg);
      color: var(--heading);
      font: inherit;
      font-size: 0.9375rem;
      transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-input:focus {
      outline: none;
      background-color: var(--card);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    .search-clear {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      line-height: 1;
      padding: 0;
    }

    .search-clear:hover {
      background-color: var(--border);
      color: var(--heading);
    }

    .search-clear[hidden] {
      display: none;
    }

    .toolbar-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-ghost {
      border: 1px solid var(--border);
      background-color: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.48rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn-ghost:hover {
      background-color: var(--surface);
      color: var(--heading);
      border-color: var(--tree-line);
    }

    .btn-ghost:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
    }

    /* Tree structure */
    .tree-root {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .tree-branch {
      border: 1px solid var(--border);
      border-radius: 12px;
      background-color: var(--card);
      overflow: hidden;
    }

    .tree-branch[data-kind="part"],
    .tree-branch[data-kind="group"] {
      border: none;
      border-radius: 8px;
      background-color: transparent;
    }

    .tree-summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      background-color: var(--surface);
      user-select: none;
      transition: background-color 0.15s ease;
    }

    .tree-summary::-webkit-details-marker {
      display: none;
    }

    .tree-summary:hover {
      background-color: #e8eef5;
    }

    .tree-summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .tree-branch[data-kind="part"] > .tree-summary,
    .tree-branch[data-kind="group"] > .tree-summary {
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      background-color: transparent;
    }

    .tree-branch[data-kind="part"] > .tree-summary:hover,
    .tree-branch[data-kind="group"] > .tree-summary:hover {
      background-color: var(--surface);
    }

    .summary-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 0;
    }

    .chevron {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--muted);
      transition: transform 0.16s ease;
    }

    .tree-branch[open] > .tree-summary .chevron {
      transform: rotate(90deg);
    }

    .node-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--accent);
    }

    .tree-branch[data-kind="category"] > .tree-summary .node-icon {
      color: var(--amber);
    }

    .tree-branch[data-kind="part"] > .tree-summary .node-icon,
    .tree-branch[data-kind="group"] > .tree-summary .node-icon {
      color: var(--teal);
    }

    .branch-text {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.15rem 0.55rem;
      min-width: 0;
    }

    .branch-title {
      font-weight: 600;
      font-size: 1.02rem;
      color: var(--heading);
    }

    .tree-branch[data-kind="part"] > .tree-summary .branch-title,
    .tree-branch[data-kind="group"] > .tree-summary .branch-title {
      font-size: 0.95rem;
    }

    .branch-meta {
      font-size: 0.86rem;
      color: var(--muted);
    }

    .count-pill {
      flex-shrink: 0;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      background-color: var(--card);
      border: 1px solid var(--border);
      padding: 0.12rem 0.55rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Nested children with crisp tree connector lines */
    .tree-children {
      list-style: none;
      margin: 0;
      padding: 0.55rem 0.9rem 0.75rem 1.75rem;
      background-color: var(--card);
    }

    .tree-branch[data-kind="category"] > .tree-children {
      padding: 0.65rem 0.85rem 0.85rem 1.5rem;
    }

    .tree-branch[data-kind="part"] > .tree-children,
    .tree-branch[data-kind="group"] > .tree-children {
      padding: 0.25rem 0 0.35rem 1.35rem;
    }

    .tree-node {
      position: relative;
      padding-left: 0.95rem;
    }

    .tree-node + .tree-node {
      margin-top: 0.25rem;
    }

    .tree-children > .tree-node::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: -0.25rem;
      width: 1.5px;
      background-color: var(--tree-line);
    }

    .tree-children > .tree-node:last-child::before {
      bottom: auto;
      height: 1.32rem;
    }

    .tree-children > .tree-node::after {
      content: "";
      position: absolute;
      left: 0;
      top: 1.32rem;
      width: 0.85rem;
      height: 1.5px;
      background-color: var(--tree-line);
    }

    .tree-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.55rem 0.8rem;
      border-radius: 9px;
      border: 1px solid transparent;
      text-decoration: none;
      color: var(--text);
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .tree-link:hover {
      background-color: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--heading);
    }

    .tree-link:focus-visible {
      outline: none;
      background-color: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.14);
    }

    .link-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.65rem;
      min-width: 0;
    }

    .chapter-badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
      background-color: var(--accent-soft);
      padding: 0.14rem 0.55rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .chapter-title {
      font-size: 0.96rem;
      font-weight: 500;
      color: var(--heading);
    }

    .link-right {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .highlight-pill {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--amber);
      background-color: var(--amber-soft);
      border: 1px solid #fde68a;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .link-arrow {
      color: var(--muted);
      font-size: 0.95rem;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .tree-link:hover .link-arrow,
    .tree-link:focus-visible .link-arrow {
      color: var(--accent);
      transform: translateX(2px);
    }

    .empty-state {
      text-align: center;
      padding: 2.25rem 1.25rem;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
    }

    .empty-state p {
      margin: 0 0 0.85rem;
    }

    mark {
      background-color: #fef08a;
      color: var(--heading);
      padding: 0 2px;
      border-radius: 3px;
    }

    @media (max-width: 640px) {
      main {
        padding: 1.5rem 1.25rem;
      }

      .tree-children {
        padding-left: 1.15rem;
        padding-right: 0.55rem;
      }

      .tree-node {
        padding-left: 0.75rem;
      }

      .tree-children > .tree-node::after {
        width: 0.65rem;
      }

      .tree-link {
        padding: 0.55rem 0.6rem;
      }

      .toolbar-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input id="toc-search" class="search-input" type="search" placeholder="Tìm sách hoặc chương... (phím /)" aria-label="Tìm sách hoặc chương">
        <button id="toc-clear" class="search-clear" type="button" title="Xóa tìm kiếm" aria-label="Xóa tìm kiếm" hidden>×</button>
      </div>
      <div class="toolbar-actions">
        <button id="expand-all" class="btn-ghost" type="button">Mở tất cả</button>
        <button id="collapse-all" class="btn-ghost" type="button">Thu gọn</button>
      </div>
    </div>

    <nav id="toc-tree" aria-label="Cây mục lục"></nav>
  </main>

  <script>
    /**
     * Cấu trúc cây mục lục (hỗ trợ lồng nhau linh hoạt):
     * - Node nhánh (có `children`):
     *   - kind: "category" (tùy chọn, dùng khi muốn gom nhiều sách theo thể loại)
     *   - kind: "book"     (một cuốn sách, có thể thêm `meta` cho tên tác giả)
     *   - kind: "part"     (tùy chọn, dùng khi sách dài cần chia Phần / Cụm chương)
     *   - open: true/false (mặc định mở khi tải trang)
     * - Node lá (có `href`):
     *   - label: nhãn ngắn bên trái (vd: "Chapter 1")
     *   - title: tên/chủ đề chương
     *   - href: đường dẫn tương đối tới file HTML của chương
     *   - storageKey: (tùy chọn) key localStorage của chương để hiển thị số từ đã highlight
     */
    const CATALOG = [
      {
        id: "the-little-prince",
        kind: "book",
        title: "The Little Prince",
        meta: "Antoine de Saint-Exupéry",
        open: true,
        children: [
          {
            label: "Chapter 1",
            title: "Bức vẽ số 1 & thế giới người lớn",
            href: "the_little_prince/chapter_1.html",
            storageKey: "the_little_prince_chapter_1_highlights"
          },
          {
            label: "Chapter 2",
            title: "Rơi máy bay ở Sahara & lời nhờ vẽ cừu",
            href: "the_little_prince/chapter_2.html",
            storageKey: "the_little_prince_chapter_2_highlights"
          },
          {
            label: "Chapter 3",
            title: "Chiếc máy bay & câu hỏi về hành tinh khác",
            href: "the_little_prince/chapter_3.html",
            storageKey: "the_little_prince_chapter_3_highlights"
          }
        ]
      }
    ];

    const treeContainer = document.getElementById("toc-tree");
    const searchInput = document.getElementById("toc-search");
    const clearBtn = document.getElementById("toc-clear");
    const expandAllBtn = document.getElementById("expand-all");
    const collapseAllBtn = document.getElementById("collapse-all");

    const openState = new Map();

    function initOpenState(nodes, prefix = "") {
      nodes.forEach((node, idx) => {
        if (!Array.isArray(node.children)) return;
        const key = node.id || `${prefix}/${idx}:${node.title}`;
        if (!openState.has(key)) {
          openState.set(key, node.open !== false);
        }
        initOpenState(node.children, key);
      });
    }

    initOpenState(CATALOG);

    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d");
    }

    function countLeafChapters(node) {
      if (!Array.isArray(node.children)) return node.href ? 1 : 0;
      return node.children.reduce((sum, child) => sum + countLeafChapters(child), 0);
    }

    function getHighlightCount(storageKey) {
      if (!storageKey) return 0;
      try {
        const raw = localStorage.getItem(storageKey);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed.length : 0;
      } catch (_) {
        return 0;
      }
    }

    function createSvgIcon(kind) {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      svg.setAttribute("aria-hidden", "true");

      if (kind === "chevron") {
        svg.setAttribute("class", "chevron");
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", "m9 18 6-6-6-6");
        svg.appendChild(path);
        return svg;
      }

      svg.setAttribute("class", "node-icon");
      if (kind === "category") {
        const p = document.createElementNS(ns, "path");
        p.setAttribute("d", "M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z");
        svg.appendChild(p);
      } else if (kind === "part" || kind === "group") {
        const p = document.createElementNS(ns, "path");
        p.setAttribute("d", "m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z");
        svg.appendChild(p);
      } else {
        const p1 = document.createElementNS(ns, "path");
        p1.setAttribute("d", "M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z");
        const p2 = document.createElementNS(ns, "path");
        p2.setAttribute("d", "M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z");
        svg.append(p1, p2);
      }
      return svg;
    }

    function appendHighlightedText(parent, text, rawQuery) {
      if (!rawQuery) {
        parent.textContent = text;
        return;
      }
      const normText = normalizeText(text);
      const normQuery = normalizeText(rawQuery.trim());
      if (!normQuery || normText.length !== text.length) {
        parent.textContent = text;
        return;
      }

      let cursor = 0;
      let idx = normText.indexOf(normQuery, cursor);
      if (idx === -1) {
        parent.textContent = text;
        return;
      }

      while (idx !== -1) {
        if (idx > cursor) {
          parent.appendChild(document.createTextNode(text.slice(cursor, idx)));
        }
        const mark = document.createElement("mark");
        mark.textContent = text.slice(idx, idx + normQuery.length);
        parent.appendChild(mark);
        cursor = idx + normQuery.length;
        idx = normText.indexOf(normQuery, cursor);
      }

      if (cursor < text.length) {
        parent.appendChild(document.createTextNode(text.slice(cursor)));
      }
    }

    function filterTree(nodes, normQuery, prefix = "") {
      if (!normQuery) {
        return nodes.map((node, idx) => {
          if (!Array.isArray(node.children)) return node;
          const key = node.id || `${prefix}/${idx}:${node.title}`;
          return {
            ...node,
            _key: key,
            children: filterTree(node.children, normQuery, key)
          };
        });
      }

      const result = [];
      nodes.forEach((node, idx) => {
        if (Array.isArray(node.children)) {
          const key = node.id || `${prefix}/${idx}:${node.title}`;
          const selfMatches =
            normalizeText(node.title).includes(normQuery) ||
            normalizeText(node.meta).includes(normQuery);
          const filteredChildren = filterTree(node.children, normQuery, key);

          if (filteredChildren.length > 0) {
            result.push({
              ...node,
              _key: key,
              _forceOpen: true,
              children: filteredChildren
            });
          } else if (selfMatches) {
            result.push({
              ...node,
              _key: key,
              _forceOpen: true,
              children: filterTree(node.children, "", key)
            });
          }
        } else {
          const leafMatches =
            normalizeText(node.label).includes(normQuery) ||
            normalizeText(node.title).includes(normQuery);
          if (leafMatches) {
            result.push(node);
          }
        }
      });
      return result;
    }

    function renderNode(node, rawQuery, isFiltering) {
      if (Array.isArray(node.children)) {
        const details = document.createElement("details");
        details.className = "tree-branch";
        details.dataset.kind = node.kind || "book";
        details.dataset.nodeKey = node._key;
        details.open = isFiltering ? Boolean(node._forceOpen) : Boolean(openState.get(node._key));

        details.addEventListener("toggle", () => {
          if (!isFiltering) {
            openState.set(node._key, details.open);
          }
        });

        const summary = document.createElement("summary");
        summary.className = "tree-summary";

        const left = document.createElement("span");
        left.className = "summary-left";
        left.appendChild(createSvgIcon("chevron"));
        left.appendChild(createSvgIcon(node.kind || "book"));

        const textWrap = document.createElement("span");
        textWrap.className = "branch-text";

        const titleEl = document.createElement("span");
        titleEl.className = "branch-title";
        appendHighlightedText(titleEl, node.title, rawQuery);
        textWrap.appendChild(titleEl);

        if (node.meta) {
          const metaEl = document.createElement("span");
          metaEl.className = "branch-meta";
          appendHighlightedText(metaEl, node.meta, rawQuery);
          textWrap.appendChild(metaEl);
        }

        left.appendChild(textWrap);
        summary.appendChild(left);

        const chapterCount = countLeafChapters(node);
        const countEl = document.createElement("span");
        countEl.className = "count-pill";
        countEl.textContent = `${chapterCount} chương`;
        summary.appendChild(countEl);

        const childList = document.createElement("ul");
        childList.className = "tree-children";
        if (node.children.length === 0) {
          const emptyLi = document.createElement("li");
          emptyLi.className = "tree-node";
          const emptyText = document.createElement("span");
          emptyText.className = "branch-meta";
          emptyText.style.display = "block";
          emptyText.style.padding = "0.45rem 0.75rem";
          emptyText.textContent = "Chưa có chương nào";
          emptyLi.appendChild(emptyText);
          childList.appendChild(emptyLi);
        } else {
          node.children.forEach((child) => {
            const li = document.createElement("li");
            li.className = "tree-node";
            li.appendChild(renderNode(child, rawQuery, isFiltering));
            childList.appendChild(li);
          });
        }

        details.append(summary, childList);
        return details;
      }

      const link = document.createElement("a");
      link.className = "tree-link";
      link.href = node.href;

      const left = document.createElement("span");
      left.className = "link-left";

      if (node.label) {
        const badge = document.createElement("span");
        badge.className = "chapter-badge";
        appendHighlightedText(badge, node.label, rawQuery);
        left.appendChild(badge);
      }

      const title = document.createElement("span");
      title.className = "chapter-title";
      appendHighlightedText(title, node.title, rawQuery);
      left.appendChild(title);

      const right = document.createElement("span");
      right.className = "link-right";

      const hlCount = getHighlightCount(node.storageKey);
      if (hlCount > 0) {
        const hlPill = document.createElement("span");
        hlPill.className = "highlight-pill";
        hlPill.textContent = `${hlCount} highlight`;
        right.appendChild(hlPill);
      }

      const arrow = document.createElement("span");
      arrow.className = "link-arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "→";
      right.appendChild(arrow);

      link.append(left, right);
      return link;
    }

    function renderTree() {
      const rawQuery = searchInput.value;
      const normQuery = normalizeText(rawQuery.trim());
      const isFiltering = normQuery.length > 0;
      clearBtn.hidden = rawQuery.length === 0;

      const filtered = filterTree(CATALOG, normQuery);
      treeContainer.innerHTML = "";

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";

        const msg = document.createElement("p");
        msg.textContent = "Không tìm thấy sách hoặc chương phù hợp.";

        const resetBtn = document.createElement("button");
        resetBtn.type = "button";
        resetBtn.className = "btn-ghost";
        resetBtn.textContent = "Xóa bộ lọc";
        resetBtn.addEventListener("click", () => {
          searchInput.value = "";
          renderTree();
          searchInput.focus();
        });

        empty.append(msg, resetBtn);
        treeContainer.appendChild(empty);
        return;
      }

      const rootList = document.createElement("ul");
      rootList.className = "tree-root";

      filtered.forEach((node) => {
        const li = document.createElement("li");
        li.appendChild(renderNode(node, rawQuery.trim(), isFiltering));
        rootList.appendChild(li);
      });

      treeContainer.appendChild(rootList);
    }

    function setAllBranches(isOpen) {
      openState.forEach((_, key) => openState.set(key, isOpen));
      treeContainer.querySelectorAll("details.tree-branch").forEach((el) => {
        el.open = isOpen;
      });
    }

    searchInput.addEventListener("input", renderTree);

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (searchInput.value) {
          searchInput.value = "";
          renderTree();
        } else {
          searchInput.blur();
        }
      }
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      renderTree();
      searchInput.focus();
    });

    expandAllBtn.addEventListener("click", () => setAllBranches(true));
    collapseAllBtn.addEventListener("click", () => setAllBranches(false));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== searchInput && !e.metaKey && !e.ctrlKey && !e.altKey) {
        const tag = document.activeElement?.tagName;
        if (tag !== "INPUT" && tag !== "TEXTAREA") {
          e.preventDefault();
          searchInput.focus();
        }
      }
    });

    renderTree();
  </script>
</body>
</html>
